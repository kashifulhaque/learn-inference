# learn-inference — the course app and its lab runner.
#
# Caddy on this host terminates TLS and proxies to learn-inference:8000 over the
# shared `edge` network, the same way the other services here are reached.
#
#   docker compose pull && docker compose up -d
#
# The host never builds the image. A merge to main runs the build-and-deploy
# workflow, which builds the image on GitHub Actions, pushes it to GHCR, and runs
# the host's `deploy learn-inference` command, which is the two commands above.
# The PDF book is built inside the image, so this file mounts nothing for it.
# Next to this file, keep a `.env` with the app's settings; see .env.example.

name: learn-inference

services:
  app:
    image: ghcr.io/kashifulhaque/learn-inference:latest
    container_name: learn-inference
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      # Localhost only. Caddy reaches the container over `edge`, so this is not
      # a route in from outside; it exists so the app can be reached through an
      # SSH tunnel before its DNS record lands:
      #   ssh -L 8087:127.0.0.1:8087 ifkash@vm.ifkash.dev
      - "127.0.0.1:8087:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - learn-inference-data:/data
    networks:
      - edge
    # This service only proxies lab runs to RunPod, so the container stays small.
    cpus: 0.5
    mem_limit: 384m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  learn-inference-data:

networks:
  edge:
    external: true
