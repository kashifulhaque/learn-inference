services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: learn-inference:latest
    container_name: learn-inference
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    ports:
      # Bound to localhost: Caddy terminates TLS and proxies to this port.
      - "127.0.0.1:8087:8000"
    volumes:
      - learn-inference-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  learn-inference-data:
